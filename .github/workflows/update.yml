name: Daten aktualisieren und veröffentlichen

on:
  schedule:
    # UTC: weekend results every 30 min, weekday results hourly. Inactive
    # leagues reuse snapshots; HTTP requests remain serialized and spaced.
    - cron: '*/30 6-22 * * 6,0'
    - cron: '15 6-22 * * 1-5'
    - cron: '0 5 * * *' # jeden Morgen
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Import mode (backfill temporarily prioritizes historical statistics)
        type: choice
        options: [standard, backfill]
        default: standard

permissions:
  contents: write # Datenstand im Branch "data" sichern
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # Der verarbeitete Datenstand (geparste Spielberichte, Logos, …) liegt im Branch "data",
      # damit nicht jeder Lauf alles neu von h4a laden muss.
      - name: Datenstand holen
        id: data
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: data
          path: data

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Bricht ab, bevor ein kaputter Parser falsche Zahlen veröffentlicht.
      - run: npm test
      - run: npm run typecheck

      - name: Daten von h4a synchronisieren
        run: node pipeline/run.ts
        env:
          BUDGET_MINUTES: ${{ inputs.mode == 'backfill' && '24' || '8' }}
          DETAIL_REQUEST_LIMIT: ${{ inputs.mode == 'backfill' && '600' || '120' }}
          SUMMARY_REQUEST_LIMIT: ${{ inputs.mode == 'backfill' && '0' || '20' }}

      - name: Seite bauen
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          if [[ "$repo" == *.github.io ]]; then export BASE_PATH=/; else export BASE_PATH="/$repo/"; fi
          npm run build

      - name: Browser-Prüfung vor Veröffentlichung
        if: github.event_name != 'schedule'
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e -- --project=desktop

      - name: Datenstand sichern
        run: |
          cd data
          if [ ! -d .git ]; then
            git init -b data
            git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Keine Änderungen"; exit 0; fi
          git commit -q -m "Datenstand $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q origin HEAD:data
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
